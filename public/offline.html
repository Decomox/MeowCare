<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6ea">
  <title>MeowCare — Sedang Offline</title>
  <style>
    :root{--bg:#fff6ea;--ink:#4a2c1d;--muted:#8a6a58;--a1:#ff8a4c}
    @media (prefers-color-scheme:dark){:root{--bg:#1d1410;--ink:#ffe9d6;--muted:#d1b29d}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:var(--bg);color:var(--ink);font-family:'Quicksand','Segoe UI',system-ui,sans-serif;font-weight:600}
    .cat{font-size:64px}
    h1{margin:0;font-size:1.4rem}
    p{margin:0;max-width:32ch;color:var(--muted)}
    button{margin-top:8px;padding:12px 24px;font:inherit;font-weight:700;color:#fff;background:var(--a1);border:2.5px solid var(--ink);border-radius:22px 12px 24px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
  </style>
</head>
<body>
  <div class="cat" aria-hidden="true">😿</div>
  <h1>Kamu lagi offline</h1>
  <p>MeowCare butuh internet untuk memuat data kucing. Cek koneksimu lalu coba lagi ya.</p>
  <button onclick="location.reload()">Coba lagi</button>
</body>
</html>
